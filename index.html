<main id="stage" aria-labelledby="office-title">

    <div style="display:flex;flex-direction:column;gap:1px;">

  <button id="home" class="home" aria-label="Về góc nhìn gốc" title="Về toàn cảnh"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5 8 3l5.5 4.5V13.5H9.8V10H6.2v3.5H2.5z"/></svg></button>
